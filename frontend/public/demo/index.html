<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedCenters Demo</title>
    <link rel="stylesheet" href="./styles.css?v=20260822-main-consolidation-v1" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand__badge">M</div>
        </div>

        <nav class="nav" id="nav"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <div class="eyebrow"></div>
            <h1 id="page-title">Главная</h1>
          </div>
          <div class="topbar-actions">
            <label class="workspace-center" id="workspaceCenter">
              <span class="workspace-center__label">Работа в медцентре</span>
              <select class="center-select" id="centerSelect" aria-label="Текущий медцентр">
                <option value="Медцентр 1">Медцентр 1</option>
                <option value="Медцентр 2">Медцентр 2</option>
              </select>
            </label>
            <div class="center-pill">
              <strong id="authStatusLabel">Гость</strong>
            </div>
            <button class="primary-button" id="showLogin" type="button">Войти по логину</button>
          </div>
        </header>

        <section class="content" id="content"></section>
      </main>
    </div>

    <div class="toast hidden" id="toast"></div>

    <div class="modal hidden" id="loginModal">
      <div class="modal__backdrop"></div>
      <div class="modal__card">
        <div class="modal__header">
          <h2>Вход в систему</h2>
          <button class="icon-button" id="closeLogin">×</button>
        </div>
        <div class="login-card">
          <label class="field">
            <span>Логин</span>
            <input id="loginInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
          </label>
          <label class="field">
            <span>Пароль</span>
            <input id="passwordInput" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" />
          </label>
          <div class="note">Вход для всех сотрудников выполняется по логину и паролю. Председатель может создавать новые учетные записи во вкладке «Сотрудник».</div>
          <button class="primary-button" id="performLogin">Войти</button>
        </div>
      </div>
    </div>

    <div class="modal hidden" id="actionModal">
      <div class="modal__backdrop"></div>
      <div class="modal__card">
        <div class="modal__header">
          <h2 id="actionModalTitle">Действие</h2>
          <button class="icon-button" id="closeAction">×</button>
        </div>
        <div class="login-card" id="actionModalContent"></div>
      </div>
    </div>

    <script src="./doctor-presets.js?v=20260611-doctor-presets-utf8"></script>
    <script src="./doctor-templates.js?v=20260811-restore-sanatorium-research-v1"></script>
    <script src="./service-cards.js?v=20260712-certificate-chairman-print"></script>
    <script>
      window.DEMO_API_BASE_URL =
        window.location.hostname === "demo.med-center.online"
          ? "https://api.med-center.online/api/v1"
          : ["localhost", "127.0.0.1"].includes(window.location.hostname)
            ? "http://127.0.0.1:8000/api/v1"
            : "/api/v1";
    </script>
    <script src="./services-data.js?v=20260731-short-service-names-v1"></script>
    <script src="./app.js?v=20260822-main-consolidation-v1"></script>
    <script src="./blanks-page.js?v=20260816-grouped-batches-v1"></script>
    <script src="./services-page.js?v=20260617-single-top-title"></script>
    <script src="./client-modal.js?v=20260721-service-encounter-rows"></script>
    <script src="./doctor-exam-modal.js?v=20260811-restore-sanatorium-research-v1"></script>
  </body>
</html>
