<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedCenters Demo</title>
    <link rel="stylesheet" href="./styles.css?v=20260704-compact-dashboard-rows" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand__badge">M</div>
        </div>

        <nav class="nav" id="nav"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <div class="eyebrow"></div>
            <h1 id="page-title">Главная</h1>
          </div>
          <div class="topbar-actions">
            <div class="center-pill">
              <strong id="authStatusLabel">Гость</strong>
            </div>
            <button class="primary-button" id="showLogin" type="button">Войти по логину</button>
          </div>
        </header>

        <section class="content" id="content"></section>
      </main>
    </div>

    <div class="toast hidden" id="toast"></div>

    <div class="modal hidden" id="loginModal">
      <div class="modal__backdrop"></div>
      <div class="modal__card">
        <div class="modal__header">
          <h2>Вход в систему</h2>
          <button class="icon-button" id="closeLogin">×</button>
        </div>
        <div class="login-card">
          <label class="field">
            <span>Логин</span>
            <input id="loginInput" value="chairman" />
          </label>
          <label class="field">
            <span>Пароль</span>
            <input id="passwordInput" type="password" value="chairman123" />
          </label>
          <div class="note">Вход для всех сотрудников выполняется по логину и паролю. Председатель может создавать новые учетные записи во вкладке «Сотрудник».</div>
          <button class="primary-button" id="performLogin">Войти</button>
        </div>
      </div>
    </div>

    <div class="modal hidden" id="actionModal">
      <div class="modal__backdrop"></div>
      <div class="modal__card">
        <div class="modal__header">
          <h2 id="actionModalTitle">Действие</h2>
          <button class="icon-button" id="closeAction">×</button>
        </div>
        <div class="login-card" id="actionModalContent"></div>
      </div>
    </div>

    <script src="./doctor-presets.js?v=20260611-doctor-presets-utf8"></script>
    <script src="./doctor-templates.js?v=20260706-doctor-preset-sync"></script>
    <script src="./service-cards.js?v=20260614-direct-word-open"></script>
    <script>
      window.DEMO_API_BASE_URL =
        window.location.hostname === "demo.med-center.online"
          ? "https://api.med-center.online/api/v1"
          : "/api/v1";
    </script>
    <script src="./services-data.js?v=20260624-ambulatory-extract-print-menu"></script>
  <script src="./app.js?v=20260706-chairman-quick-button-guard-002-gyno-status"></script>
    <script src="./blanks-page.js?v=20260506-blanks-page"></script>
    <script src="./services-page.js?v=20260617-single-top-title"></script>
    <script src="./client-modal.js?v=20260623-client-sex-visit"></script>
  <script src="./doctor-exam-modal.js?v=20260706-doctor-preset-sync"></script>
  </body>
</html>
